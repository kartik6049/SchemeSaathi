<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1f4d3a" />
    <meta name="description" content="Find government welfare schemes you are likely eligible for, in Hindi or English. Free, no login." />
    <title>SchemeSaathi — Find schemes you're eligible for</title>
    <script>
      // Apply saved / system theme before first paint to avoid a flash.
      try {
        const t = localStorage.getItem('ss.theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
